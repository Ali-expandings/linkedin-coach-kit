name: windows-setup

on:
  push:
  workflow_dispatch:

jobs:
  setup:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Run setup.cmd (what the user double-clicks), CI mode
        shell: cmd
        run: setup.cmd -CI

      - name: Generated opencode.json
        shell: pwsh
        run: Get-Content opencode.json

      - name: Kit is self-contained (uv + node inside tools\)
        shell: pwsh
        run: |
          tools\uv\uv.exe --version
          tools\node\node.exe --version
          if (-not (Test-Path tools\node_modules\@playwright\mcp\cli.js)) { throw "browser tool missing" }

      - name: Both MCP servers start from the generated config and expose the expected tools
        shell: pwsh
        run: python tests/list_tools.py

      - name: Browser tool drives a real page
        shell: pwsh
        run: python tests/browser_smoke.py

      - name: Coach browser profile launches (not signed in on CI, so exit 2 is expected)
        shell: pwsh
        run: |
          # exit 2 is the expected answer here; stop pwsh from treating it as a failure
          $PSNativeCommandUseErrorActionPreference = $false
          $out = & tools\node\node.exe tools\seed-browser-login.mjs --browser chrome --check-only 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 2 -or $out -notmatch 'NOT_LOGGED_IN') { throw "unexpected result: exit $code" }
          Write-Host "OK  Chrome opened the coach profile and LinkedIn asked for sign-in, as expected on CI"
          exit 0

      - name: OpenCode 1.19.0 loads the project config and connects both servers
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          npm install -g opencode-ai@1.19.0 --no-audit --no-fund
          opencode --version
          $out = opencode mcp list 2>&1 | Out-String
          Write-Host $out
          $connected = ([regex]::Matches($out, 'connected')).Count
          if ($connected -lt 3) { throw "expected 3 connected servers, saw $connected" }

      - name: Unipile MCP sends the right requests (mock API, kit's own Node)
        shell: pwsh
        env:
          KIT_NODE: tools\node\node.exe
        run: python tests/unipile_test.py

      - name: Unipile requests match Unipile's published schema
        shell: pwsh
        env:
          KIT_NODE: tools\node\node.exe
        run: |
          python -m pip install --quiet jsonschema
          python tests/unipile_schema_test.py

      - name: setup.cmd saves a Unipile key
        shell: cmd
        run: |
          call setup.cmd -CI -UnipileKey "ci-test-key" || exit /b 1
          python -c "import json,sys; raw=open('tools/unipile.json','rb').read(); bom=raw.startswith(bytes([239,187,191])); d=json.loads(raw); print(d, 'BOM' if bom else 'no BOM'); sys.exit(0 if d == {'api_key': 'ci-test-key'} and not bom else 1)" || exit /b 1
          del tools\unipile.json

      - name: Running setup a second time is safe
        shell: cmd
        run: setup.cmd -CI

  install-with-opencode:
    # Runs the exact download command from INSTALL-WITH-OPENCODE.md, then setup in CI mode.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Step 1 command from INSTALL-WITH-OPENCODE.md (downloads the public main.zip)
        shell: cmd
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -Command "$ErrorActionPreference='Stop'; [Net.ServicePointManager]::SecurityProtocol='Tls12'; $dest='C:\linkedin-coach'; if (Test-Path (Join-Path $dest 'setup.cmd')) { 'ALREADY_INSTALLED' } else { $zip=Join-Path $env:TEMP 'linkedin-coach.zip'; Invoke-WebRequest -UseBasicParsing 'https://github.com/Ali-expandings/linkedin-coach-kit/archive/refs/heads/main.zip' -OutFile $zip; $tmp=Join-Path $env:TEMP 'linkedin-coach-unzip'; if (Test-Path $tmp) { Remove-Item -Recurse -Force $tmp }; Expand-Archive -Force $zip $tmp; New-Item -ItemType Directory -Force $dest | Out-Null; Copy-Item -Recurse -Force (Join-Path $tmp 'linkedin-coach-kit-main\*') $dest; Get-ChildItem -Recurse $dest | Unblock-File; 'INSTALLED' }"
          if not exist C:\linkedin-coach\setup.cmd exit /b 1
      - name: Running Step 1 again says ALREADY_INSTALLED
        shell: cmd
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -Command "$dest='C:\linkedin-coach'; if (Test-Path (Join-Path $dest 'setup.cmd')) { 'ALREADY_INSTALLED' } else { exit 1 }"
      - name: setup.cmd from the installed folder (CI mode)
        shell: cmd
        run: |
          cd /d C:\linkedin-coach
          call setup.cmd -CI || exit /b 1
          if not exist C:\linkedin-coach\opencode.json exit /b 1
          type C:\linkedin-coach\opencode.json
